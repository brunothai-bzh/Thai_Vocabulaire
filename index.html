<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="ภาษาไทย">
<title>ภาษาไทย · Vocabulaire</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@300;400;500;600&family=DM+Sans:wght@300;400;500&family=DM+Mono&display=swap');
:root {
  --bg:#F7F5F0;--surface:#FFFFFF;--surface2:#F0EDE6;
  --border:rgba(0,0,0,0.10);--border2:rgba(0,0,0,0.18);
  --text:#1A1814;--text2:#6B6560;--text3:#A09A93;
  --accent:#C4521A;--accent-bg:#FBF0EA;
  --accent2:#2E6B4F;--accent2-bg:#EAF3EE;
  --danger:#A32D2D;--danger-bg:#FCEBEB;
  --shadow:0 2px 12px rgba(0,0,0,0.07);
  --shadow-lg:0 8px 32px rgba(0,0,0,0.12);
  --radius:14px;--radius-sm:8px;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
body{font-family:'DM Sans',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;}

header{background:var(--surface);border-bottom:1px solid var(--border);padding:16px 20px 12px;position:sticky;top:0;z-index:100;display:flex;align-items:center;justify-content:space-between;}
.header-title{display:flex;align-items:baseline;gap:10px;}
.header-title h1{font-family:'Noto Sans Thai',sans-serif;font-size:22px;font-weight:600;color:var(--text);}
.header-title span{font-size:12px;color:var(--text3);text-transform:uppercase;letter-spacing:.5px;}
.voice-pill{font-size:11px;font-weight:500;padding:5px 10px;border-radius:20px;background:var(--surface2);color:var(--text3);border:1px solid var(--border);transition:all .3s;}
.voice-pill.ok{background:var(--accent2-bg);color:var(--accent2);border-color:rgba(46,107,79,.2);}

.toolbar{padding:14px 20px;display:flex;gap:10px;}
.search-wrap{flex:1;position:relative;}
.search-icon{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--text3);font-size:15px;pointer-events:none;}
input[type=text]{font-family:'DM Sans',sans-serif;font-size:15px;width:100%;padding:11px 14px 11px 38px;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-sm);color:var(--text);outline:none;-webkit-appearance:none;}
input[type=text]:focus{border-color:var(--accent);}
input[type=text]::placeholder{color:var(--text3);}
.search-wrap input{padding-left:38px;}

.btn{font-family:'DM Sans',sans-serif;font-size:14px;font-weight:500;padding:11px 16px;border-radius:var(--radius-sm);border:1px solid var(--border2);background:var(--surface);color:var(--text);cursor:pointer;white-space:nowrap;-webkit-appearance:none;}
.btn:active{background:var(--surface2);}
.btn.accent{background:var(--accent);color:#fff;border-color:var(--accent);}
.btn.accent:active{background:#a84315;}

.add-form{margin:0 20px 14px;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:16px;display:none;flex-direction:column;gap:12px;box-shadow:var(--shadow);}
.add-form.open{display:flex;}
.add-form-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;}
.field label{display:block;font-size:11px;font-weight:500;color:var(--text3);text-transform:uppercase;letter-spacing:.6px;margin-bottom:5px;}
.field input{padding:10px 12px;font-size:15px;}
.field input.thai-input{font-family:'Noto Sans Thai',sans-serif;font-size:20px;padding-left:10px;}
.form-actions{display:flex;align-items:center;gap:10px;}
.feedback-msg{font-size:12px;color:var(--accent2);font-weight:500;opacity:0;transition:opacity .3s;}
.feedback-msg.show{opacity:1;}

.count-bar{padding:0 20px 8px;font-size:12px;color:var(--text3);}
.table-wrap{padding:0 20px 120px;}
.word-list{display:flex;flex-direction:column;gap:8px;}
.word-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:14px 16px;display:grid;grid-template-columns:64px 1fr auto;align-items:center;gap:14px;cursor:pointer;transition:background .12s,border-color .12s;box-shadow:var(--shadow);user-select:none;-webkit-user-select:none;}
.word-card:active{background:var(--surface2);}
.word-card.active{border-color:var(--accent);background:var(--accent-bg);}
.word-thai{font-family:'Noto Sans Thai',sans-serif;font-size:26px;font-weight:500;text-align:center;line-height:1.3;}
.word-roman{font-family:'DM Mono',monospace;font-size:13px;color:var(--accent);}
.word-meaning{font-size:15px;color:var(--text);}
.word-actions{display:flex;gap:8px;align-items:center;}
.speak-btn{width:44px;height:44px;border-radius:50%;border:1px solid var(--border2);background:var(--surface2);color:var(--text2);font-size:20px;display:flex;align-items:center;justify-content:center;cursor:pointer;flex-shrink:0;}
.speak-btn:active{background:var(--surface);}
.speak-btn.playing{background:var(--accent);color:#fff;border-color:var(--accent);}
.del-btn{width:36px;height:36px;border-radius:50%;border:none;background:transparent;color:var(--text3);font-size:16px;display:flex;align-items:center;justify-content:center;cursor:pointer;}
.del-btn:active{background:var(--danger-bg);color:var(--danger);}
.empty-state{text-align:center;padding:48px 20px;color:var(--text3);font-size:15px;}

/* Modal */
.modal-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,0.5);z-index:200;align-items:flex-end;justify-content:center;}
.modal-overlay.open{display:flex;}
.modal{background:var(--surface);border-radius:var(--radius) var(--radius) 0 0;width:100%;padding:20px 20px 30px;box-shadow:var(--shadow-lg);animation:slideUp .25s ease;max-height:95vh;overflow-y:auto;}
@keyframes slideUp{from{transform:translateY(40px);opacity:0;}to{transform:translateY(0);opacity:1;}}
.modal-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;}
.modal-title{font-size:17px;font-weight:500;}
.modal-close{width:32px;height:32px;border-radius:50%;border:none;background:var(--surface2);color:var(--text2);font-size:18px;display:flex;align-items:center;justify-content:center;cursor:pointer;}

/* Compositeur */
.word-composer{display:flex;align-items:center;gap:10px;margin-bottom:14px;background:var(--surface2);border-radius:var(--radius-sm);padding:10px 14px;border:1px solid var(--border);}
.word-composed{font-family:'Noto Sans Thai',sans-serif;font-size:34px;font-weight:500;color:var(--accent);flex:1;min-height:48px;letter-spacing:2px;word-break:break-all;}
.word-composed.empty{color:var(--text3);font-size:16px;font-family:'DM Sans',sans-serif;font-weight:400;display:flex;align-items:center;}
.composer-actions{display:flex;gap:6px;flex-shrink:0;}
.composer-btn{width:40px;height:40px;border-radius:var(--radius-sm);border:1px solid var(--border2);background:var(--surface);color:var(--text2);font-size:18px;display:flex;align-items:center;justify-content:center;cursor:pointer;}
.composer-btn:active{background:var(--surface2);}
.composer-btn.speak{background:var(--accent2-bg);color:var(--accent2);border-color:rgba(46,107,79,.25);}

/* Sections clavier */
.kbd-section{margin-bottom:12px;}
.kbd-label{font-size:10px;font-weight:500;color:var(--text3);text-transform:uppercase;letter-spacing:.7px;margin-bottom:7px;}
.kbd-row{display:flex;flex-wrap:wrap;gap:5px;}
.kbd-key{font-family:'Noto Sans Thai',sans-serif;font-size:19px;min-width:38px;height:48px;padding:0 5px;border-radius:var(--radius-sm);border:1px solid var(--border2);background:var(--surface);color:var(--text);cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;transition:background .08s,transform .08s;-webkit-user-select:none;}
.kbd-key:active{background:var(--accent-bg);border-color:var(--accent);transform:scale(.92);}
.kbd-key .rom{font-family:'DM Mono',monospace;font-size:8px;color:var(--text3);line-height:1;margin-top:1px;}
.kbd-key.vowel{background:#EAF3EE;border-color:rgba(46,107,79,.2);}
.kbd-key.vowel:active{background:var(--accent2);color:#fff;}
.kbd-key.tone{background:#FBF0EA;border-color:rgba(196,82,26,.2);}
.kbd-key.tone:active{background:var(--accent);color:#fff;}
.kbd-key.num{background:var(--surface2);}

/* Infos mot */
.divider{font-size:11px;color:var(--text3);text-align:center;margin:12px 0 10px;text-transform:uppercase;letter-spacing:.6px;}
.modal-fields{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px;}
.modal-fields .field input{padding:10px 12px;}
.modal-actions{display:flex;gap:10px;}
.btn-full{flex:1;text-align:center;}

.fab{position:fixed;bottom:28px;right:24px;width:58px;height:58px;border-radius:50%;background:var(--accent2);color:#fff;border:none;font-size:26px;display:flex;align-items:center;justify-content:center;box-shadow:0 4px 20px rgba(46,107,79,.4);cursor:pointer;z-index:150;}
.fab:active{transform:scale(.93);}

@media(min-width:600px){
  .modal{border-radius:var(--radius);max-width:640px;margin-bottom:40px;}
  .modal-overlay{align-items:center;}
  .kbd-key{min-width:42px;font-size:21px;}
}
</style>
</head>
<body>

<header>
  <div class="header-title">
    <h1>ภาษาไทย</h1>
    <span>vocabulaire</span>
  </div>
  <div id="voice-pill" class="voice-pill">⚠ voix</div>
</header>

<div class="toolbar">
  <div class="search-wrap">
    <span class="search-icon">🔍</span>
    <input type="text" id="search" placeholder="rechercher…" autocomplete="off" autocorrect="off" spellcheck="false" />
  </div>
  <button class="btn" id="toggle-add">+ ajouter</button>
</div>

<div class="add-form" id="add-form">
  <div class="add-form-grid">
    <div class="field">
      <label>thaï *</label>
      <input type="text" id="inp-thai" class="thai-input" placeholder="เช่น แมว" autocomplete="off" autocorrect="off" spellcheck="false" />
    </div>
    <div class="field">
      <label>romanisation</label>
      <input type="text" id="inp-roman" placeholder="ex : mæw" autocomplete="off" autocorrect="off" spellcheck="false" />
    </div>
    <div class="field">
      <label>sens (français)</label>
      <input type="text" id="inp-meaning" placeholder="ex : chat" autocomplete="off" spellcheck="false" />
    </div>
  </div>
  <div class="form-actions">
    <button class="btn accent" id="btn-add-word">✓ enregistrer</button>
    <span class="feedback-msg" id="feedback">✓ ajouté !</span>
  </div>
</div>

<div class="count-bar" id="count-bar"></div>
<div class="table-wrap"><div class="word-list" id="word-list"></div></div>

<button class="fab" id="fab-kbd" title="Clavier thaï">⌨️</button>

<!-- Modal clavier -->
<div class="modal-overlay" id="modal-overlay">
  <div class="modal">
    <div class="modal-header">
      <div class="modal-title">⌨️ Clavier thaï</div>
      <button class="modal-close" id="modal-close-btn">✕</button>
    </div>

    <!-- Mot composé -->
    <div class="word-composer">
      <div class="word-composed empty" id="composed">appuie sur les touches…</div>
      <div class="composer-actions">
        <button class="composer-btn speak" id="compose-speak" title="Écouter">🔊</button>
        <button class="composer-btn" id="compose-del" title="Effacer dernier">⌫</button>
        <button class="composer-btn" id="compose-clear" title="Tout effacer">✕</button>
      </div>
    </div>

    <!-- Consonnes -->
    <div class="kbd-section">
      <div class="kbd-label">Consonnes (44)</div>
      <div class="kbd-row" id="kbd-consonants"></div>
    </div>

    <!-- Voyelles -->
    <div class="kbd-section">
      <div class="kbd-label">Voyelles</div>
      <div class="kbd-row" id="kbd-vowels"></div>
    </div>

    <!-- Tons & signes -->
    <div class="kbd-section">
      <div class="kbd-label">Tons & signes diacritiques</div>
      <div class="kbd-row" id="kbd-tones"></div>
    </div>

    <!-- Chiffres -->
    <div class="kbd-section">
      <div class="kbd-label">Chiffres thaï</div>
      <div class="kbd-row" id="kbd-numbers"></div>
    </div>

    <div class="divider">informations du mot</div>
    <div class="modal-fields">
      <div class="field">
        <label>romanisation</label>
        <input type="text" id="s-roman" placeholder="ex : mæw" autocomplete="off" autocorrect="off" spellcheck="false" />
      </div>
      <div class="field">
        <label>sens (français)</label>
        <input type="text" id="s-meaning" placeholder="ex : chat" autocomplete="off" spellcheck="false" />
      </div>
    </div>
    <div class="modal-actions">
      <button class="btn btn-full" id="modal-cancel-btn">annuler</button>
      <button class="btn accent btn-full" id="modal-save-btn">✓ enregistrer le mot</button>
    </div>
  </div>
</div>

<script>
'use strict';
const WORDS_KEY = 'thai_words_v2';
const INITIAL = [
  {thai:"เงา",roman:"ngao",meaning:"ombre"},
  {thai:"ยา",roman:"yaa",meaning:"médicament"},
  {thai:"น้ำ",roman:"nám",meaning:"eau"},
  {thai:"ข้าว",roman:"kâao",meaning:"riz"},
  {thai:"บ้าน",roman:"bâan",meaning:"maison"},
  {thai:"แมว",roman:"mæw",meaning:"chat"},
  {thai:"หมา",roman:"mǎa",meaning:"chien"},
  {thai:"ดี",roman:"dii",meaning:"bien / bon"},
  {thai:"กิน",roman:"gin",meaning:"manger"},
  {thai:"ไป",roman:"pai",meaning:"aller"},
  {thai:"มา",roman:"maa",meaning:"venir"},
  {thai:"รัก",roman:"rák",meaning:"aimer"},
  {thai:"เนื้อไก่",roman:"néua gài",meaning:"viande de poulet"},
];

const CONSONANTS = [
  {c:'ก',r:'g'},{c:'ข',r:'kh'},{c:'ฃ',r:'kh'},{c:'ค',r:'kh'},
  {c:'ฅ',r:'kh'},{c:'ฆ',r:'kh'},{c:'ง',r:'ng'},{c:'จ',r:'j'},
  {c:'ฉ',r:'ch'},{c:'ช',r:'ch'},{c:'ซ',r:'s'},{c:'ฌ',r:'ch'},
  {c:'ญ',r:'y'},{c:'ฎ',r:'d'},{c:'ฏ',r:'t'},{c:'ฐ',r:'th'},
  {c:'ฑ',r:'th'},{c:'ฒ',r:'th'},{c:'ณ',r:'n'},{c:'ด',r:'d'},
  {c:'ต',r:'t'},{c:'ถ',r:'th'},{c:'ท',r:'th'},{c:'ธ',r:'th'},
  {c:'น',r:'n'},{c:'บ',r:'b'},{c:'ป',r:'p'},{c:'ผ',r:'ph'},
  {c:'ฝ',r:'f'},{c:'พ',r:'ph'},{c:'ฟ',r:'f'},{c:'ภ',r:'ph'},
  {c:'ม',r:'m'},{c:'ย',r:'y'},{c:'ร',r:'r'},{c:'ล',r:'l'},
  {c:'ว',r:'w'},{c:'ศ',r:'s'},{c:'ษ',r:'s'},{c:'ส',r:'s'},
  {c:'ห',r:'h'},{c:'ฬ',r:'l'},{c:'อ',r:'o'},{c:'ฮ',r:'h'},
];
const VOWELS = [
  {c:'า',r:'aa'},{c:'ิ',r:'i'},{c:'ี',r:'ii'},{c:'ึ',r:'ue'},
  {c:'ื',r:'uee'},{c:'ุ',r:'u'},{c:'ู',r:'uu'},{c:'เ',r:'e'},
  {c:'แ',r:'ae'},{c:'โ',r:'o'},{c:'ใ',r:'ai'},{c:'ไ',r:'ai'},
  {c:'ำ',r:'am'},{c:'ั',r:'a'},{c:'็',r:'(bref)'},{c:'ว',r:'ua/w'},
  {c:'ย',r:'ai/y'},{c:'อ',r:'o'},{c:'ื',r:'ue'},{c:'ว',r:'w'},
];
const TONES = [
  {c:'่',r:'mai ek'},{c:'้',r:'mai tho'},{c:'๊',r:'mai tri'},{c:'๋',r:'mai jat'},
  {c:'์',r:'silent'},{c:'ํ',r:'nasal'},{c:'ๆ',r:'répét.'},{c:'ฯ',r:'etc.'},
  {c:'ฺ',r:'phinthu'},{c:'๎',r:'angkhan'},{c:'ๅ',r:'fong man'},
];
const NUMBERS = [
  {c:'๐',r:'0'},{c:'๑',r:'1'},{c:'๒',r:'2'},{c:'๓',r:'3'},{c:'๔',r:'4'},
  {c:'๕',r:'5'},{c:'๖',r:'6'},{c:'๗',r:'7'},{c:'๘',r:'8'},{c:'๙',r:'9'},
];

let words=[], activeRow=null, playingWord=null;
let thaiVoice=null, synth=window.speechSynthesis;
let composedWord='';

function loadWords(){
  try{const s=localStorage.getItem(WORDS_KEY);if(s){const p=JSON.parse(s);if(Array.isArray(p)&&p.length>0){words=p;return;}}}catch(e){}
  words=INITIAL.map(w=>({thai:w.thai,roman:w.roman,meaning:w.meaning}));
  saveWords();
}
function saveWords(){try{localStorage.setItem(WORDS_KEY,JSON.stringify(words));}catch(e){}}

function checkVoices(){
  const voices=synth.getVoices();
  const v=voices.find(v=>v.lang.startsWith('th'));
  if(v){thaiVoice=v;const p=document.getElementById('voice-pill');p.textContent='🔊 voix ok';p.classList.add('ok');}
}
checkVoices();synth.onvoiceschanged=checkVoices;

function speak(word){
  if(!word)return;
  synth.cancel();playingWord=word;render();
  const u=new SpeechSynthesisUtterance(word);
  u.lang='th-TH';u.rate=0.85;u.pitch=1.1;
  if(thaiVoice)u.voice=thaiVoice;
  u.onend=()=>{playingWord=null;render();};
  u.onerror=()=>{playingWord=null;render();};
  synth.speak(u);
}

function render(){
  const q=(document.getElementById('search').value||'').toLowerCase();
  const filtered=words.filter(w=>{
    const h=(w.thai||'')+' '+(w.roman||'')+' '+(w.meaning||'');
    return h.toLowerCase().includes(q);
  });
  const n=filtered.length;
  document.getElementById('count-bar').textContent=n+' mot'+(n!==1?'s':'');
  const list=document.getElementById('word-list');list.innerHTML='';
  if(n===0){list.innerHTML='<div class="empty-state">aucun mot trouvé</div>';return;}
  filtered.forEach(w=>{
    const card=document.createElement('div');
    card.className='word-card'+(activeRow===w.thai?' active':'');
    const thaiDiv=document.createElement('div');thaiDiv.className='word-thai';
    thaiDiv.textContent=w.thai;
    const metaDiv=document.createElement('div');
    metaDiv.innerHTML='<div class="word-roman">'+(w.roman||'')+'</div><div class="word-meaning">'+(w.meaning||'')+'</div>';
    const actDiv=document.createElement('div');actDiv.className='word-actions';
    const spk=document.createElement('button');
    spk.className='speak-btn'+(playingWord===w.thai?' playing':'');
    spk.textContent=playingWord===w.thai?'⏸':'🔊';
    spk.addEventListener('click',e=>{e.stopPropagation();speak(w.thai);});
    const del=document.createElement('button');del.className='del-btn';del.textContent='✕';
    del.addEventListener('click',e=>{
      e.stopPropagation();
      words=words.filter(x=>x.thai!==w.thai);
      if(activeRow===w.thai)activeRow=null;
      if(playingWord===w.thai){synth.cancel();playingWord=null;}
      saveWords();render();
    });
    actDiv.appendChild(spk);actDiv.appendChild(del);
    card.appendChild(thaiDiv);card.appendChild(metaDiv);card.appendChild(actDiv);
    card.addEventListener('click',()=>{activeRow=w.thai;speak(w.thai);});
    list.appendChild(card);
  });
}

document.getElementById('search').addEventListener('input',render);

document.getElementById('toggle-add').addEventListener('click',()=>{
  const f=document.getElementById('add-form'),btn=document.getElementById('toggle-add');
  const open=f.classList.toggle('open');
  btn.textContent=open?'✕ fermer':'+ ajouter';
  if(open)setTimeout(()=>document.getElementById('inp-thai').focus(),80);
  else['inp-thai','inp-roman','inp-meaning'].forEach(id=>document.getElementById(id).value='');
});

function doAddWord(){
  const thai=document.getElementById('inp-thai').value.trim();
  const roman=document.getElementById('inp-roman').value.trim();
  const meaning=document.getElementById('inp-meaning').value.trim();
  if(!thai){document.getElementById('inp-thai').focus();return;}
  words.push({thai,roman,meaning});saveWords();
  ['inp-thai','inp-roman','inp-meaning'].forEach(id=>document.getElementById(id).value='');
  document.getElementById('inp-thai').focus();
  const fb=document.getElementById('feedback');fb.classList.add('show');
  setTimeout(()=>fb.classList.remove('show'),1600);
  render();
}
document.getElementById('btn-add-word').addEventListener('click',doAddWord);
['inp-thai','inp-roman','inp-meaning'].forEach(id=>{
  document.getElementById(id).addEventListener('keydown',e=>{if(e.key==='Enter')doAddWord();});
});

// ── Clavier thaï ──
function buildKeyboard(){
  function makeRow(data, rowId, extraClass){
    const row=document.getElementById(rowId);
    data.forEach(d=>{
      const btn=document.createElement('button');
      btn.className='kbd-key'+(extraClass?' '+extraClass:'');
      const main=document.createElement('span');main.textContent=d.c;
      btn.appendChild(main);
      if(d.r){const rom=document.createElement('span');rom.className='rom';rom.textContent=d.r;btn.appendChild(rom);}
      btn.addEventListener('click',()=>{
        composedWord+=d.c;
        updateComposer();
      });
      row.appendChild(btn);
    });
  }
  makeRow(CONSONANTS,'kbd-consonants','');
  makeRow(VOWELS,'kbd-vowels','vowel');
  makeRow(TONES,'kbd-tones','tone');
  makeRow(NUMBERS,'kbd-numbers','num');
}

function updateComposer(){
  const el=document.getElementById('composed');
  if(composedWord){
    el.textContent=composedWord;
    el.classList.remove('empty');
  } else {
    el.textContent='appuie sur les touches…';
    el.classList.add('empty');
  }
}

document.getElementById('compose-speak').addEventListener('click',()=>speak(composedWord));
document.getElementById('compose-del').addEventListener('click',()=>{
  composedWord=[...composedWord].slice(0,-1).join('');
  updateComposer();
});
document.getElementById('compose-clear').addEventListener('click',()=>{
  composedWord='';updateComposer();
});

// ── Modal ──
document.getElementById('fab-kbd').addEventListener('click',()=>{
  composedWord='';updateComposer();
  document.getElementById('s-roman').value='';
  document.getElementById('s-meaning').value='';
  document.getElementById('modal-overlay').classList.add('open');
});
function closeModal(){
  document.getElementById('modal-overlay').classList.remove('open');
}
document.getElementById('modal-close-btn').addEventListener('click',closeModal);
document.getElementById('modal-cancel-btn').addEventListener('click',closeModal);
document.getElementById('modal-overlay').addEventListener('click',e=>{
  if(e.target===document.getElementById('modal-overlay'))closeModal();
});

document.getElementById('modal-save-btn').addEventListener('click',()=>{
  if(!composedWord)return;
  const roman=document.getElementById('s-roman').value.trim();
  const meaning=document.getElementById('s-meaning').value.trim();
  words.push({thai:composedWord,roman,meaning});
  saveWords();closeModal();render();
});

// ── Init ──
loadWords();
buildKeyboard();
render();
</script>
</body>
</html>
